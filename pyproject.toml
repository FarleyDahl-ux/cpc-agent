[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpc-agent"
version = "0.1.0"
description = "CPC Preparation Agent (prototype) — local, human-gated draft workshop brief builder."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
