[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpc-agent"
version = "0.1.0"
description = "CPC Preparation Agent (prototype) — local, human-gated draft workshop brief builder."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpc_agent = ["templates/*.css", "templates/dashboard/*.html", "templates/dashboard/static/*.css"]

[tool.pytest.ini_options]
markers = ["integration: calls the real OpenAI API (requires .env); skipped by default"]
addopts = "-m 'not integration'"
